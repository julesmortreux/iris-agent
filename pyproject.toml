[project]
name = "iris-agent"
version = "1.0.0"
description = "Agent conversationnel de recherche de contacts, sur une API legacy"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
"backend/prompts.py" = ["E501"]
"legacy_api/generate_data.py" = ["E501"]
